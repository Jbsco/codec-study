name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-test-${{ runner.os }}-${{ hashFiles('ada/alire.toml') }}
          restore-keys: alire-test-${{ runner.os }}-

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            haskell/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('haskell/stack.yaml', 'haskell/huffman-audio.cabal') }}
          restore-keys: stack-${{ runner.os }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Install flac and Stack
        run: sudo apt-get update && sudo apt-get install -y flac haskell-stack

      - name: Select GNAT toolchain
        run: |
          cd ada
          alr -n toolchain --select gnat_native gprbuild

      - name: Run the test gate
        run: |
          set -o pipefail
          eval "$(cd ada && alr -n printenv)"
          bash test.do 2>&1 | tee test-output.log
          grep -q "test: all checks pass" test-output.log
