name: Release

# Every merge to main publishes a release once the repository variable RELEASE_NAME is set; until then the job is
# skipped. The pull request's required checks have already tested this tree. The job tags the merge as the next
# version before building, so git describe gives the clean tag and the programs, the tarball and the release agree.
# Versions start at v0.1.0, and each release raises the last number: v0.1.1, v0.1.2, and on past v0.1.9 to v0.1.10.
# A tag pushed by hand on a new line, such as v0.2.0, starts that line.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: vars.RELEASE_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Alire
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-test-${{ runner.os }}-${{ hashFiles('ada/alire.toml') }}
          restore-keys: alire-test-${{ runner.os }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Select GNAT toolchain
        run: |
          cd ada
          alr -n toolchain --select gnat_native gprbuild
          alr -n update

      - name: Tag this merge
        run: |
          git fetch --tags -q
          if git describe --tags --exact-match --match 'v*' HEAD > /dev/null 2>&1; then
            next="$(git describe --tags --exact-match --match 'v*' HEAD)"
          else
            last="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
            if [ -z "$last" ]; then
              next=v0.1.0
            else
              next="${last%.*}.$(( ${last##*.} + 1 ))"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$next" -m "release $next" "${{ github.sha }}"
            git push origin "$next"
          fi
          echo "VERSION=$next" >> "$GITHUB_ENV"

      - name: Package
        run: |
          eval "$(cd ada && alr -n printenv)"
          test "$(git describe --tags --match 'v*' --abbrev=8)" = "$VERSION"
          bash release.sh dist "${{ vars.RELEASE_NAME }}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/*.tar.gz dist/*.sha256 --verify-tag --title "${{ vars.RELEASE_NAME }} $VERSION" \
            --generate-notes
