name: Style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  style:
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The hosted-only steps stay, gated, so a job moves back to a hosted runner by its runs-on line alone.
      - name: Cache Alire
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-style-${{ runner.os }}-${{ hashFiles('ada/alire.toml') }}
          restore-keys: alire-style-${{ runner.os }}-

      - name: Cache Stack
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            haskell/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('haskell/stack.yaml', 'haskell/huffman-audio.cabal') }}
          restore-keys: stack-${{ runner.os }}-

      - name: Install Alire
        if: runner.environment == 'github-hosted'
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Install Stack
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y haskell-stack

      - name: Select GNAT toolchain
        if: runner.environment == 'github-hosted'
        run: |
          cd ada
          alr -n toolchain --select gnat_native gprbuild

      # The checkout's own dependency fetch runs everywhere, so a cold clone resolves its toolchain.
      - name: Fetch the crate's dependencies
        run: |
          cd ada
          alr -n update

      - name: Run the style gate
        run: |
          set -o pipefail
          eval "$(cd ada && alr -n printenv)"
          bash style.do 2>&1 | tee style-output.log
          grep -q "style: all checks clean" style-output.log
