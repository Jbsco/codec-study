name: SPARK Proofs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a branch supersedes the proof run of its previous tip.
concurrency:
  group: spark-proofs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire
        uses: actions/cache@v4
        with:
          path: |
            ~/.config/alire
            ~/.cache/alire
            ~/.local/share/alire
          key: alire-prove-${{ runner.os }}-${{ hashFiles('ada/alire.toml') }}
          restore-keys: alire-prove-${{ runner.os }}-

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: 2.1.1

      - name: Select GNAT toolchain and fetch gnatprove
        run: |
          cd ada
          alr -n toolchain --select gnat_native gprbuild
          alr -n update
          alr -n exec -- gnatprove --version

      - name: Run SPARK proofs
        env:
          PROVE_JOBS: 4
          PROVE_SWITCHES: --timeout=600
        run: |
          set -o pipefail
          bash prove.do 2>&1 | tee prove-output.log
          grep -q "decoder 100% proved" prove-output.log
          grep -q "(0 pragma Assume, 0 justified" prove-output.log
